<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Game Theory</title>
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/katex@0.16/dist/katex.min.css">
  <style>
    :root {
      --theme-color: #0066cc;
    }
    .sidebar-nav a {
      font-size: 0.92em;
    }
    .sidebar > h1 {
      font-size: 1.1rem;
      font-weight: 700;
      text-align: center;
      padding: 1rem 0.5rem;
      line-height: 1.4;
    }
    .markdown-section h1 {
      font-size: 2rem;
    }
    .markdown-section h2 {
      border-bottom: 2px solid #f0f0f0;
      padding-bottom: 0.4rem;
      margin-top: 2.5rem;
    }
    .markdown-section blockquote {
      border-left: 4px solid #0066cc;
      background: #f5f9ff;
      padding: 0.8rem 1rem;
      border-radius: 0 4px 4px 0;
    }
    .book-nav { display: flex; justify-content: space-between; gap: 1rem; margin-top: 3rem; padding-top: 1.5rem; border-top: 1px solid #eee; }
    .book-nav-link { display: flex; flex-direction: column; max-width: 48%; padding: 0.8rem 1rem; border: 1px solid #e5e5e5; border-radius: 6px; text-decoration: none !important; }
    .book-nav-link:hover { border-color: var(--theme-color); }
    .book-nav-link.next { margin-left: auto; text-align: right; }
    .book-nav-link small { color: #888; }
  </style>
</head>
<body>
  <div id="app">Loading...</div>
  <script>
    window.$docsify = {
      name: 'Game Theory',
      repo: 'https://github.com/undercurremt/GameTheory',
      homepage: 'README.md',
      loadSidebar: '_sidebar.md',
      subMaxLevel: 0, // sidebar shows lesson titles only, not the headings inside each page
      auto2top: true,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search the course...',
        noData: 'No results found.',
        depth: 3,
      },
      themeColor: '#0066cc',
      coverpage: false,
      plugins: [
        // Math: $$…$$ and \[…\] (display), \(…\) (inline), rendered with KaTeX.
        // Formulas are lifted out before Markdown parsing (so _ and \ inside them survive), then rendered back in.
        function (hook) {
          var MATH = /\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]|\\\(([\s\S]+?)\\\)/g
          var CODE = /(```[\s\S]*?```|`[^`\n]*`)/
          var found = []
          hook.beforeEach(function (md) {
            found = []
            return md.split(CODE).map(function (part, i) {
              if (i % 2) return part // code — leave untouched
              return part.replace(MATH, function (_, d1, d2, inl) {
                found.push({ tex: d1 || d2 || inl, display: !inl })
                return 'KATEXMATH' + (found.length - 1) + 'X'
              })
            }).join('')
          })
          hook.afterEach(function (html, next) {
            next(html.replace(/KATEXMATH(\d+)X/g, function (m, n) {
              var f = found[+n]
              if (!f || !window.katex) return m
              return katex.renderToString(f.tex.trim(), { displayMode: f.display, throwOnError: false, strict: false })
            }))
          })
        },
        // ← Previous / Next → at the bottom of each lesson (list generated by tools/build.py)
        function (hook, vm) {
          hook.afterEach(function (html, next) {
            var pages = window.BOOK_PAGES || []
            var norm = function (s) { return String(s || '').replace(/^\//, '').replace(/\.md$/, '') }
            var cur = norm(vm.route.file)
            var i = pages.findIndex(function (p) { return norm(p.file) === cur })
            if (i === -1) return next(html)
            var link = function (p, cls, dir) {
              return p ? '<a class="book-nav-link ' + cls + '" href="#/' + norm(p.file) + '"><small>' + dir +
                '</small><span>' + p.label + '</span></a>' : '<span></span>'
            }
            next(html + '<nav class="book-nav">' + link(pages[i - 1], 'prev', '← Previous') +
              link(pages[i + 1], 'next', 'Next →') + '</nav>')
          })
        },
      ],
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/katex@0.16/dist/katex.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="book-pages.js"></script>
</body>
</html>

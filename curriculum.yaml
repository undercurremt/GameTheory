# Course curriculum — Game Theory Master Curriculum v2.0 (restructured from v1.0: 101 -> 91 lessons, 15 merges, 5 new).
# Single source of truth for part/lesson titles, core concepts, guiding questions, prerequisites and related lessons.
# `v1` lists the v1.0 lesson numbers each lesson was built from (empty = new lesson).
# Edit here, then run: python tools/build.py   (sidebar and part pages are regenerated from this)

